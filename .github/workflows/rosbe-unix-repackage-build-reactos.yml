# Build ReactOS after repackaging RosBE from the published pre-built sources.
#
# This workflow covers the "repackage from pre-built archives" validation path:
#   - Download source archives from https://svn.reactos.org/RosBE-Sources/rosbe_2.2.1/
#   - Run RosBE-Unix/makepackage.sh to build RosBE-Unix-2.2.1.tar.bz2
#   - Install that tarball via the shared install-rosbe composite action
#   - Build ReactOS (bootcd) with the installed toolchain
#
# Trigger options:
#   1) Manual dispatch (after this workflow exists on the default branch)
#   2) Pull request label "ci: build-reactos-from-prebuilt-sources"

name: RosBE-Unix — Repackage and Build ReactOS

on:
  workflow_dispatch:
    inputs:
      reactos_ref:
        description: >-
          ReactOS git ref to check out (branch, tag, or commit SHA).
          Leave blank to use the default branch.
        required: false
        default: ''
        type: string
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  repackage-build-reactos:
    name: Repackage RosBE from pre-built sources and build ReactOS (bootcd)
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'ci: build-reactos-from-prebuilt-sources'))
    timeout-minutes: 360
    env:
      ROSBE_VERSION: 2.2.1
      ROSBE_INSTALL_DIR: ${{ github.workspace }}/rosbe-install

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download pre-built RosBE source archives
        shell: bash
        run: |
          set -euo pipefail

          rs_sources_dir="$GITHUB_WORKSPACE/RosBE-Unix/Base-i386/sources"
          rs_source_base_url="https://svn.reactos.org/RosBE-Sources/rosbe_${ROSBE_VERSION}"
          mkdir -p "$rs_sources_dir"

          rs_archives=(
            binutils.tar.bz2
            bison.tar.bz2
            cmake.tar.bz2
            flex.tar.bz2
            gcc.tar.bz2
            gmp.tar.bz2
            mingw_w64.tar.bz2
            mpc.tar.bz2
            mpfr.tar.bz2
            ninja.tar.bz2
          )

          for rs_archive in "${rs_archives[@]}"; do
            echo "Downloading $rs_archive..."
            curl \
              --retry 3 \
              --retry-delay 10 \
              --max-time 300 \
              --fail \
              --location \
              --output "$rs_sources_dir/$rs_archive" \
              "$rs_source_base_url/$rs_archive"
            || {
              echo "Failed to download $rs_archive from $rs_source_base_url"
              exit 1
            }
          done

          ls -lh "$rs_sources_dir"

      - name: Build RosBE package from pre-built archives
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/RosBE-Unix"
          ./makepackage.sh Base-i386 "$ROSBE_VERSION"
          ls -lh "$GITHUB_WORKSPACE/RosBE-Unix/RosBE-Unix-$ROSBE_VERSION.tar.bz2"

      - name: Install repackaged RosBE and run smoke test
        uses: ./.github/actions/install-rosbe
        with:
          tarball_path: ${{ github.workspace }}/RosBE-Unix/RosBE-Unix-${{ env.ROSBE_VERSION }}.tar.bz2
          install_dir: ${{ env.ROSBE_INSTALL_DIR }}

      - name: Checkout ReactOS source (shallow)
        uses: actions/checkout@v4
        with:
          repository: reactos/reactos
          ref: ${{ inputs.reactos_ref }}
          fetch-depth: 1
          path: reactos

      - name: Configure ReactOS build
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/reactos"
          ./configure.sh -DCMAKE_BUILD_TYPE=Debug

      - name: Build ReactOS (bootcd target)
        shell: bash
        run: |
          set -euo pipefail
          ninja -C "$GITHUB_WORKSPACE/reactos/output-MinGW-i386" bootcd
