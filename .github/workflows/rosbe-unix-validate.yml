# Validate the published RosBE-Unix 2.2.1 release end-to-end.
#
# This workflow:
#   - Downloads the official RosBE-Unix-2.2.1.tar.bz2 from SourceForge.
#   - Runs RosBE-Builder.sh to compile and install the full toolchain.
#   - Verifies the installed cross-compiler with a cross-compile smoke test.
#
# For a full ReactOS build, use the separate "RosBE-Unix — Build ReactOS"
# workflow (manual trigger only).
#
# Resource notes:
#   - Compiling the toolchain (GCC 8.4.0 cross-compiler, binutils, CMake, etc.)
#     takes approximately 60–90 minutes on a standard ubuntu-latest runner
#     (4 vCPUs, 16 GB RAM, Ubuntu 24.04).
#   - The shared install and smoke-test steps live in the composite action at
#     .github/actions/install-rosbe/action.yml.

name: RosBE-Unix — Validate installed release

on:
  push:
    branches:
      - ci-work
    paths:
      - 'RosBE-Unix/**'
      - '.github/workflows/rosbe-unix-validate.yml'
      - '.github/actions/install-rosbe/**'
  pull_request:
    paths:
      - 'RosBE-Unix/**'
      - '.github/workflows/rosbe-unix-validate.yml'
      - '.github/actions/install-rosbe/**'

permissions:
  contents: read

jobs:
  install-rosbe:
    name: Install RosBE 2.2.1 and cross-compile smoke test
    runs-on: ubuntu-latest
    # Toolchain compilation typically finishes within 90 minutes; 120 gives
    # headroom for slow runners without masking genuine hangs.
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        # Required so that the local composite action (.github/actions/install-rosbe)
        # is available on disk before it is referenced below.
        uses: actions/checkout@v4

      - name: Install RosBE and run smoke test
        uses: ./.github/actions/install-rosbe
        with:
          install_dir: ${{ github.workspace }}/rosbe-install
