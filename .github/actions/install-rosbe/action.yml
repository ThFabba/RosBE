# Composite action: extract, compile, install, and smoke-test a RosBE-Unix
# package tarball, then set up the environment for subsequent workflow steps.
#
# The caller supplies the tarball to install via the tarball_path input.
# This is intentionally separate from download-rosbe so that future workflows
# can supply a locally-built package rather than the official release.
#
# After this action runs, the job environment is ready to build ReactOS:
#   - $RUNNER_TOOL_CACHE paths include the RosBE bin directories
#   - ROS_ARCH, BISON_PKGDATADIR, HOST, CFLAGS, CXXFLAGS, LDFLAGS are set
# This mirrors what sourcing the installed RosBE.sh would do, without requiring
# an interactive shell.
#
# cmake.patch (RosBE-Unix/cmake.patch) is NOT applied here because it is only
# needed on GCC 16+.  ubuntu-latest (Ubuntu 24.04) ships GCC 13, which does
# not trigger the compilation error the patch fixes.  If the runner is ever
# upgraded to a distro with GCC 16 or later, add a step that patches the cmake
# source inside the extracted tarball before calling RosBE-Builder.sh.

name: Install RosBE toolchain
description: >-
  Extracts a RosBE-Unix package tarball, compiles and installs the toolchain
  via RosBE-Builder.sh, verifies it with a cross-compile smoke test, and
  exports the RosBE environment for subsequent workflow steps.

inputs:
  tarball_path:
    description: >-
      Absolute path to the RosBE-Unix package tarball (.tar.bz2) to install.
      Typically the output of the download-rosbe action, but any compatible
      tarball produced by makepackage.sh works.
    required: true
  install_dir:
    description: Absolute path where the toolchain should be installed.
    required: true

runs:
  using: composite
  steps:
    - name: Show runner environment
      shell: bash
      run: |
        echo "=== Runner environment ==="
        uname -a
        echo "CPUs: $(nproc)"
        echo "RAM : $(free -h | awk '/^Mem/{print $2}')"
        echo "Disk: $(df -h . | awk 'NR==2{print $4}') free on workspace"
        gcc --version | head -1
        python3 --version

    - name: Install build dependencies
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends \
          build-essential \
          bzip2 \
          curl \
          m4 \
          texinfo \
          zlib1g-dev

    - name: Extract package
      shell: bash
      run: tar -C "$RUNNER_TEMP" -xjf "${{ inputs.tarball_path }}"

    - name: Install RosBE toolchain (non-interactive)
      # Find RosBE-Builder.sh inside the extracted tarball — this works
      # regardless of the exact version subdirectory name in the archive.
      # Pass the install directory as $1 so the script skips the interactive
      # install-dir and "press Return" prompts.  Pipe "yes" to answer the
      # non-root confirmation that the published 2.2.1 script still asks even
      # when $1 is provided.
      shell: bash
      env:
        ROSBE_INSTALL_DIR: ${{ inputs.install_dir }}
      run: |
        ROSBE_BUILDER=$(find "$RUNNER_TEMP" -maxdepth 2 -name "RosBE-Builder.sh" | head -1)
        if [[ -z "$ROSBE_BUILDER" ]]; then
          echo "ERROR: RosBE-Builder.sh not found in extracted tarball"
          exit 1
        fi
        echo "Using installer: $ROSBE_BUILDER"
        echo "yes" | "$ROSBE_BUILDER" "$ROSBE_INSTALL_DIR"

    - name: Verify installation
      shell: bash
      env:
        ROSBE_INSTALL_DIR: ${{ inputs.install_dir }}
      run: |
        echo "Installed version: $(cat "$ROSBE_INSTALL_DIR/RosBE-Version")"
        "$ROSBE_INSTALL_DIR/i386/bin/i686-w64-mingw32-gcc" --version

    - name: Cross-compile smoke test
      # Compile a trivial C program for the i686-w64-mingw32 target to
      # confirm the installed toolchain can produce PE/COFF output.
      shell: bash
      env:
        ROSBE_INSTALL_DIR: ${{ inputs.install_dir }}
      run: |
        printf 'int main(void) { return 0; }\n' > "$RUNNER_TEMP/hello.c"
        "$ROSBE_INSTALL_DIR/i386/bin/i686-w64-mingw32-gcc" \
          -o "$RUNNER_TEMP/hello.exe" \
          "$RUNNER_TEMP/hello.c"
        echo "Cross-compilation smoke test passed."
        file "$RUNNER_TEMP/hello.exe"

    - name: Set up RosBE environment for subsequent steps
      # Export PATH and environment variables that the installed RosBE.sh
      # would set up in an interactive session.  Using $GITHUB_PATH and
      # $GITHUB_ENV makes them available to all subsequent steps in this job.
      #
      # Equivalent to what sourcing RosBE.sh does:
      #   - Prepends <install>/i386/bin and <install>/bin to PATH
      #   - Sets ROS_ARCH=i386 (via change_architecture)
      #   - Sets BISON_PKGDATADIR so Bison finds its data files even if the
      #     install tree has been relocated
      #   - Clears HOST, CFLAGS, CXXFLAGS, LDFLAGS to avoid cross-contamination
      shell: bash
      env:
        ROSBE_INSTALL_DIR: ${{ inputs.install_dir }}
      run: |
        echo "$ROSBE_INSTALL_DIR/i386/bin" >> "$GITHUB_PATH"
        echo "$ROSBE_INSTALL_DIR/bin" >> "$GITHUB_PATH"
        echo "ROS_ARCH=i386" >> "$GITHUB_ENV"
        echo "BISON_PKGDATADIR=$ROSBE_INSTALL_DIR/share/bison" >> "$GITHUB_ENV"
        echo "HOST=" >> "$GITHUB_ENV"
        echo "CFLAGS=" >> "$GITHUB_ENV"
        echo "CXXFLAGS=" >> "$GITHUB_ENV"
        echo "LDFLAGS=" >> "$GITHUB_ENV"
