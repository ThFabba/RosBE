# Validate the RosBE-Unix packaging pipeline end-to-end.
#
# This workflow:
#   - Downloads pre-built source archives from the ReactOS SVN mirror via
#     RosBE-Unix/fetch-sources.sh.
#   - Bundles them into a distributable package using makepackage.sh and
#     uploads it as a downloadable artifact.
#   - Installs the generated package via RosBE-Builder.sh.
#   - Verifies the installed cross-compiler with a cross-compile smoke test.
#
# If the "ci: compare-packages" label is applied to a PR, a second job runs
# compare-packages.sh against the official release using the uploaded artifact.
# Apply the label before or after pushing; either way a new run will be
# triggered that includes the comparison job.
#
# For a full ReactOS build, use the separate "RosBE-Unix — Build ReactOS"
# workflow (manual trigger only).
#
# Resource notes:
#   - Compiling the toolchain (GCC 8.4.0 cross-compiler, binutils, CMake, etc.)
#     takes approximately 60–90 minutes on a standard ubuntu-latest runner
#     (4 vCPUs, 16 GB RAM, Ubuntu 24.04).
#   - The install and smoke-test steps live in .github/actions/install-rosbe/action.yml.

name: RosBE-Unix — Validate packaged release

on:
  push:
    branches:
      - ci-work
    paths:
      - 'RosBE-Unix/**'
      - '.github/workflows/rosbe-unix-validate.yml'
      - '.github/actions/download-rosbe/**'
      - '.github/actions/install-rosbe/**'
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - 'RosBE-Unix/**'
      - '.github/workflows/rosbe-unix-validate.yml'
      - '.github/actions/download-rosbe/**'
      - '.github/actions/install-rosbe/**'

permissions:
  contents: read

jobs:
  build-and-install-rosbe:
    name: Build RosBE package and cross-compile smoke test
    runs-on: ubuntu-latest
    # Toolchain compilation typically finishes within 90 minutes; 120 gives
    # headroom for slow runners without masking genuine hangs.
    timeout-minutes: 120
    env:
      ROSBE_VERSION: 2.2.1
      ROSBE_INSTALL_DIR: ${{ github.workspace }}/rosbe-install

    steps:
      - name: Checkout repository
        # Required so that the local composite actions are available on disk.
        uses: actions/checkout@v7

      - name: Fetch pre-built source archives
        shell: bash
        working-directory: ${{ github.workspace }}/RosBE-Unix
        run: ./fetch-sources.sh

      - name: Build RosBE package
        shell: bash
        working-directory: ${{ github.workspace }}/RosBE-Unix
        run: ./makepackage.sh Base-i386 "$ROSBE_VERSION"

      - name: Upload generated package
        uses: actions/upload-artifact@v4
        with:
          name: rosbe-package
          path: ${{ github.workspace }}/RosBE-Unix/RosBE-Unix-${{ env.ROSBE_VERSION }}.tar.bz2

      - name: Install RosBE and run smoke test
        uses: ./.github/actions/install-rosbe
        with:
          tarball_path: ${{ github.workspace }}/RosBE-Unix/RosBE-Unix-${{ env.ROSBE_VERSION }}.tar.bz2
          install_dir: ${{ env.ROSBE_INSTALL_DIR }}

  compare-packages:
    name: Compare generated package against official release
    needs: build-and-install-rosbe
    # Run on every push to a PR that has the "ci: compare-packages" label.
    # Most code changes are expected to alter the generated package, so the
    # comparison is not run on every push.
    if: >-
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'ci: compare-packages')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # compare-packages.sh uses `git diff RosBE-2.2.1..HEAD` to patch the
          # reference before comparing.  The tag must be present.
          fetch-tags: true

      - name: Download generated package
        uses: actions/download-artifact@v4
        with:
          name: rosbe-package
          path: ${{ runner.temp }}/package

      - name: Download reference package
        id: download_reference
        uses: ./.github/actions/download-rosbe

      - name: Compare packages
        shell: bash
        run: |
          gen_pkg=$(find "$RUNNER_TEMP/package" -maxdepth 1 -name "*.tar.bz2")
          RosBE-Unix/compare-packages.sh "$gen_pkg" "${{ steps.download_reference.outputs.tarball_path }}"
